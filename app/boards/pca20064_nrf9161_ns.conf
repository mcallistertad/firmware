# The PCA20064 prototype carries the same BME688/BME680-compatible environmental
# sensor used by the production Thingy:91 X application.
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

CONFIG_BME680=n
CONFIG_BME68X_IAQ=y
CONFIG_BME68X_IAQ_THREAD_STACK_SIZE=2048
CONFIG_BME68X_IAQ_SAMPLE_RATE_ULTRA_LOW_POWER=y

# PCA20064 low-power reporting policy. Send one sample immediately after boot,
# then do not let the cloud shadow request a cadence shorter than 12 hours.
CONFIG_APP_TRIGGER_TIMEOUT_SECONDS=43200
CONFIG_APP_TRIGGER_MIN_TIMEOUT_SECONDS=43200
CONFIG_FREQUENT_POLL_DURATION_INTERVAL_SEC=1

# Align the requested periodic TAU with the reporting cadence so the modem does
# not wake for the previous two-hour TAU while otherwise idle.
CONFIG_LTE_PSM_REQ_RPTAU_SECONDS=43200

# Enable RGB status indication while retaining the low-power reporting policy.
# The LED module suspends PWM0 when the status is LED_OFF.
CONFIG_APP_LED=y
CONFIG_APP_LED_LOG_LEVEL_DBG=n
CONFIG_APP_LED_LOG_LEVEL_INF=y
CONFIG_PWM=y

# Keep the trace facility available for a future diagnostic build, but stop
# continuous LTE/IP trace generation and external-flash writes in production.
CONFIG_NRF_MODEM_LIB_TRACE_LEVEL_OFF=y

# Allow the nRF Cloud credential installer to send multiline PEM credentials
# through the AT shell on VCOM0. The combined AWS and CoAP CA command is larger
# than the shell defaults, so both the UART ring and command buffer must grow.
CONFIG_AT_SHELL_UNESCAPE_LF=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=4096
