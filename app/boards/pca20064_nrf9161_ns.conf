# The PCA20064 prototype carries the same BME688/BME680-compatible environmental
# sensor used by the production Thingy:91 X application.
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

CONFIG_BME680=n
CONFIG_BME68X_IAQ=y
CONFIG_BME68X_IAQ_THREAD_STACK_SIZE=2048
CONFIG_BME68X_IAQ_SAMPLE_RATE_ULTRA_LOW_POWER=y

# Allow nRF Cloud PEM credentials to be provisioned through CONFIG_AT_SHELL.
CONFIG_SHELL_CMD_BUFF_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=4096
CONFIG_AT_SHELL_UNESCAPE_LF=y
